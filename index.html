<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blokken Spel</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

h1{
margin:10px;
}

#score{
font-size:20px;
}

canvas{
background:black;
border:2px solid #444;
margin-top:10px;
}

.controls{
margin-top:10px;
}

button{
font-size:24px;
padding:12px;
margin:4px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<h1>🧱 Blokken Spel</h1>

<div id="score">Score: 0</div>

<canvas id="game" width="300" height="600"></canvas>

<div class="controls">
<button onclick="move(-1)">⬅️</button>
<button onclick="rotate()">🔄</button>
<button onclick="move(1)">➡️</button>
<button onclick="drop()">⬇️</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const COLS=10;
const ROWS=20;
const SIZE=30;

let score=0;

const colors=[
null,
"#00ffff",
"#ffff00",
"#ff00ff",
"#00ff00",
"#ff0000",
"#0000ff",
"#ff8800"
];

const shapes=[
[],
[[1,1,1,1]],
[[2,2],[2,2]],
[[0,3,0],[3,3,3]],
[[0,4,4],[4,4,0]],
[[5,5,0],[0,5,5]],
[[6,0,0],[6,6,6]],
[[0,0,7],[7,7,7]]
];

let board=Array.from(
{length:ROWS},
()=>Array(COLS).fill(0)
);

function newPiece(){
const id=Math.floor(Math.random()*7)+1;

return{
shape:shapes[id],
color:id,
x:3,
y:0
};
}

let piece=newPiece();

function drawCell(x,y,c){
ctx.fillStyle=colors[c];
ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);

ctx.strokeStyle="#222";
ctx.strokeRect(x*SIZE,y*SIZE,SIZE,SIZE);
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let y=0;y<ROWS;y++){
for(let x=0;x<COLS;x++){
if(board[y][x]){
drawCell(x,y,board[y][x]);
}
}
}

piece.shape.forEach((row,dy)=>{
row.forEach((v,dx)=>{
if(v){
drawCell(
piece.x+dx,
piece.y+dy,
piece.color
);
}
});
});
}

function collide(){

for(let y=0;y<piece.shape.length;y++){

for(let x=0;x<piece.shape[y].length;x++){

if(piece.shape[y][x]){

let nx=piece.x+x;
let ny=piece.y+y;

if(
nx<0||
nx>=COLS||
ny>=ROWS||
(ny>=0&&board[ny][nx])
){
return true;
}

}
}
}

return false;
}

function merge(){

piece.shape.forEach((row,y)=>{
row.forEach((v,x)=>{
if(v){
board[piece.y+y][piece.x+x]=piece.color;
}
});
});

}

function clearLines(){

for(let y=ROWS-1;y>=0;y--){

if(board[y].every(v=>v!==0)){

board.splice(y,1);
board.unshift(Array(COLS).fill(0));

score+=100;

document.getElementById("score").innerText=
"Score: "+score;

y++;
}
}
}

function move(dir){

piece.x+=dir;

if(collide()){
piece.x-=dir;
}

draw();
}

function rotate(){

const old=piece.shape;

piece.shape=
old[0].map((v,i)=>
old.map(r=>r[i]).reverse()
);

if(collide()){
piece.shape=old;
}

draw();
}

function drop(){

piece.y++;

if(collide()){

piece.y--;

merge();

clearLines();

piece=newPiece();

if(collide()){

alert("Game Over");

board=
Array.from(
{length:ROWS},
()=>Array(COLS).fill(0)
);

score=0;

document.getElementById("score").innerText=
"Score: 0";
}
}

draw();
}

function loop(){
drop();
setTimeout(loop,600);
}

let startX=0;
let startY=0;

canvas.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{

let dx=e.changedTouches[0].clientX-startX;
let dy=e.changedTouches[0].clientY-startY;

if(Math.abs(dx)>Math.abs(dy)){

if(dx>30) move(1);
if(dx<-30) move(-1);

}else{

if(dy>30) drop();
if(dy<-30) rotate();

}

});

draw();
loop();
</script>

</body>
</html>
